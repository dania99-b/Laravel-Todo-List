openapi: 3.0.3
info:
  title: Todo List API
  version: 1.0.0
  description: Per-user todo list REST API (Laravel 12 + Sanctum bearer tokens).
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Rate limited }
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Rate limited }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current token
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: No content }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user profile
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { user: { $ref: '#/components/schemas/User' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /todos:
    get:
      tags: [Todos]
      summary: List the authenticated user's todos
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TodoStatus' } }
        - { name: priority, in: query, schema: { $ref: '#/components/schemas/TodoPriority' } }
        - { name: search, in: query, schema: { type: string, maxLength: 255 }, description: Substring match on title and description }
        - { name: due_date_from, in: query, schema: { type: string, format: date } }
        - { name: due_date_to, in: query, schema: { type: string, format: date } }
        - { name: sort_by, in: query, schema: { type: string, enum: [title, status, priority, due_date, created_at, updated_at], default: created_at } }
        - { name: sort_direction, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
      responses:
        '200': { description: Paginated list, content: { application/json: { schema: { $ref: '#/components/schemas/TodoPage' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Todos]
      summary: Create a todo
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TodoWrite' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TodoEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /todos/{id}:
    get:
      tags: [Todos]
      summary: Show a todo
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TodoId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TodoEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: Todo belongs to another user }
        '404': { description: Not found }
    put:
      tags: [Todos]
      summary: Replace a todo (full update)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TodoId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TodoWrite' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TodoEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: Todo belongs to another user }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Todos]
      summary: Delete a todo
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TodoId' }]
      responses:
        '204': { description: No content }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: Todo belongs to another user }
        '404': { description: Not found }
  /todos/{id}/status:
    patch:
      tags: [Todos]
      summary: Update a todo's status
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TodoId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { $ref: '#/components/schemas/TodoStatus' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TodoEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: Todo belongs to another user }
        '404': { description: Not found }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    TodoId: { name: id, in: path, required: true, schema: { type: integer } }
  responses:
    Unauthenticated:
      description: Unauthenticated
      content: { application/json: { schema: { type: object, properties: { message: { type: string } } } } }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
  schemas:
    TodoStatus: { type: string, enum: [pending, completed] }
    TodoPriority: { type: string, enum: [low, medium, high] }
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        password_confirmation: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        created_at: { type: string, format: date-time }
    AuthResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        token: { type: string }
    Todo:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TodoStatus' }
        priority: { $ref: '#/components/schemas/TodoPriority' }
        due_date: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TodoWrite:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 255 }
        description: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TodoStatus' }
        priority: { $ref: '#/components/schemas/TodoPriority' }
        due_date: { type: string, format: date-time, nullable: true }
    TodoEnvelope:
      type: object
      properties: { data: { $ref: '#/components/schemas/Todo' } }
    TodoPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Todo' } }
        links: { type: object }
        meta: { type: object }
